<script>
// On phones, a second single tap on the enlarged artwork returns to the book.
// Dragging, scrolling and pinch gestures keep the artwork open.
(() => {
 const mobile=matchMedia('(max-width:700px)'),image=document.getElementById('artFull'),dialog=document.getElementById('artDialog');
 const active=new Set();let gesture=null,canClose=false;
 image.addEventListener('pointerdown',e=>{
  canClose=false;
  if(!mobile.matches||!dialog.open)return;
  active.add(e.pointerId);
  if(active.size>1){if(gesture)gesture.valid=false;return;}
  gesture={id:e.pointerId,x:e.clientX,y:e.clientY,valid:e.isPrimary!==false};
 });
 image.addEventListener('pointermove',e=>{
  if(gesture&&e.pointerId===gesture.id&&Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>12)gesture.valid=false;
 });
 document.addEventListener('pointerup',e=>{
  active.delete(e.pointerId);
  if(!gesture||e.pointerId!==gesture.id)return;
  canClose=gesture.valid&&active.size===0&&Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)<=12;
  gesture=null;
 });
 document.addEventListener('pointercancel',e=>{active.delete(e.pointerId);gesture=null;canClose=false;});
 image.addEventListener('click',()=>{
  if(mobile.matches&&dialog.open&&canClose)dialog.close();
  canClose=false;
 });
 dialog.addEventListener('close',()=>{active.clear();gesture=null;canClose=false;});
})();
</script>
<script>
(() => {
 const dialog=document.getElementById('contentsDialog'),scroller=dialog.querySelector('.contents-scroll'),image=dialog.querySelector('.toc-backdrop img');
 let frame=0,lastKey='';
 function paint(){
  const height=scroller.clientHeight,width=scroller.clientWidth;
  if(!dialog.open||!height||!width)return;
  const ratio=image.naturalWidth?image.naturalHeight/image.naturalWidth:3;
  const artworkHeight=Math.max(height*2.4,width*ratio);
  const range=Math.max(1,scroller.scrollHeight-height);
  const progress=Math.max(0,Math.min(1,scroller.scrollTop/range));
  const offset=(artworkHeight-height)*progress;
  const key=height+':'+width+':'+offset.toFixed(2);
  if(key===lastKey)return;lastKey=key;
  dialog.style.setProperty('--toc-art-height',artworkHeight+'px');
  // Position directly, rather than relying on a transformed compositor layer.
  // This is user-controlled scrolling, including when reduced motion is enabled.
  image.style.transform='none';image.style.top=(-offset).toFixed(2)+'px';
 }
 function tick(){frame=0;if(!dialog.open)return;paint();frame=requestAnimationFrame(tick);}
 function sync(){
  if(!dialog.open){if(frame)cancelAnimationFrame(frame);frame=0;lastKey='';return;}
  paint();if(!frame)frame=requestAnimationFrame(tick);
 }
 scroller.addEventListener('scroll',paint,{passive:true});
 scroller.addEventListener('touchmove',sync,{passive:true});
 dialog.addEventListener('scroll',paint,{passive:true,capture:true});
 addEventListener('resize',sync,{passive:true});
 if(typeof ResizeObserver!=='undefined')new ResizeObserver(sync).observe(scroller);
 new MutationObserver(sync).observe(dialog,{attributes:true,attributeFilter:['open']});
 image.addEventListener('load',()=>{lastKey='';sync();});
 dialog.addEventListener('close',sync);
})();
</script>
<script>
// Refit the existing page text when the mobile browser toolbar changes height.
(() => {
 const mobile=matchMedia('(max-width:700px) and (orientation:portrait)'),book=document.getElementById('book');
 let lastHeight=0,frame=0;
 new ResizeObserver(()=>{
  if(!mobile.matches)return;
  const height=Math.round(book.getBoundingClientRect().height);
  if(height===lastHeight)return;
  lastHeight=height;
  if(frame)cancelAnimationFrame(frame);
  frame=requestAnimationFrame(()=>{frame=0;dispatchEvent(new Event('resize'));});
 }).observe(book);
})();
</script>
<script>
// Use a centered inspection composition for the Limbrain emblem only.
document.addEventListener('click',event=>{
 const button=event.target.closest('[data-art]');
 if(!button||button.dataset.art!=='37')return;
 queueMicrotask(()=>{
  const dialog=document.getElementById('artDialog');if(!dialog.open)return;
  const image=document.getElementById('artFull');
  image.src='limbrein-emblem-dark-cloth.webp?v=arcwane-dark-cloth-v3-20261004';
  image.parentNode.classList.add('no-dim');
 });
});
</script>
<script>
// Every faction title page becomes a distinct, centered contents separator.
function markFactionStarts(){
 const list=document.getElementById('contentsList'),data=window.ARKVEIN_BOOK;if(!list||!data)return;
 data.pages.forEach((page,index)=>{
  if(page.type!=='chapter'||!page.chapter||page.chapter==='world')return;
  const row=list.querySelector('[data-page="'+index+'"]');if(!row)return;
  row.classList.add('toc-faction-start');
  row.setAttribute('aria-label','Начало фракции: '+page.title.replace(/\n/g,' '));
  let previous=row.previousElementSibling;
  while(previous&&previous.tagName!=='H3')previous=previous.previousElementSibling;
  if(previous)previous.classList.add('toc-faction-duplicate');
 });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',markFactionStarts,{once:true});else markFactionStarts();
</script>
