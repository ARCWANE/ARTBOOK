<script>
// On phones, a second single tap on the enlarged artwork returns to the book.
// Dragging, scrolling and pinch gestures keep the artwork open.
(() => {
 const mobile=matchMedia('(max-width:700px)'),image=document.getElementById('artFull'),dialog=document.getElementById('artDialog');
 const active=new Set();let gesture=null,canClose=false;
 image.addEventListener('pointerdown',e=>{
  canClose=false;
  if(!mobile.matches||!dialog.open)return;
  active.add(e.pointerId);
  if(active.size>1){if(gesture)gesture.valid=false;return;}
  gesture={id:e.pointerId,x:e.clientX,y:e.clientY,valid:e.isPrimary!==false};
 });
 image.addEventListener('pointermove',e=>{
  if(gesture&&e.pointerId===gesture.id&&Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>12)gesture.valid=false;
 });
 document.addEventListener('pointerup',e=>{
  active.delete(e.pointerId);
  if(!gesture||e.pointerId!==gesture.id)return;
  canClose=gesture.valid&&active.size===0&&Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)<=12;
  gesture=null;
 });
 document.addEventListener('pointercancel',e=>{active.delete(e.pointerId);gesture=null;canClose=false;});
 image.addEventListener('click',()=>{
  if(mobile.matches&&dialog.open&&canClose)dialog.close();
  canClose=false;
 });
 dialog.addEventListener('close',()=>{active.clear();gesture=null;canClose=false;});
})();
</script>
<script>
(() => {
 const dialog=document.getElementById('contentsDialog'),scroller=dialog.querySelector('.contents-scroll'),image=dialog.querySelector('.toc-backdrop img');
 let frame=0,lastKey='';
 function paint(){
  const height=scroller.clientHeight,width=scroller.clientWidth;
  if(!dialog.open||!height||!width)return;
  const ratio=image.naturalWidth?image.naturalHeight/image.naturalWidth:3;
  const artworkHeight=Math.max(height*2.4,width*ratio);
  const range=Math.max(1,scroller.scrollHeight-height);
  const progress=Math.max(0,Math.min(1,scroller.scrollTop/range));
  const offset=(artworkHeight-height)*progress;
  const key=height+':'+width+':'+offset.toFixed(2);
  if(key===lastKey)return;lastKey=key;
  dialog.style.setProperty('--toc-art-height',artworkHeight+'px');
  // Position directly, rather than relying on a transformed compositor layer.
  // This is user-controlled scrolling, including when reduced motion is enabled.
  image.style.transform='none';image.style.top=(-offset).toFixed(2)+'px';
 }
 function tick(){frame=0;if(!dialog.open)return;paint();frame=requestAnimationFrame(tick);}
 function sync(){
  if(!dialog.open){if(frame)cancelAnimationFrame(frame);frame=0;lastKey='';return;}
  paint();if(!frame)frame=requestAnimationFrame(tick);
 }
 scroller.addEventListener('scroll',paint,{passive:true});
 scroller.addEventListener('touchmove',sync,{passive:true});
 dialog.addEventListener('scroll',paint,{passive:true,capture:true});
 addEventListener('resize',sync,{passive:true});
 if(typeof ResizeObserver!=='undefined')new ResizeObserver(sync).observe(scroller);
 new MutationObserver(sync).observe(dialog,{attributes:true,attributeFilter:['open']});
 image.addEventListener('load',()=>{lastKey='';sync();});
 dialog.addEventListener('close',sync);
})();
</script>
<script>
// Refit the existing page text when the mobile browser toolbar changes height.
(() => {
 const mobile=matchMedia('(max-width:700px) and (orientation:portrait)'),book=document.getElementById('book');
 let lastHeight=0,frame=0;
 new ResizeObserver(()=>{
  if(!mobile.matches)return;
  const height=Math.round(book.getBoundingClientRect().height);
  if(height===lastHeight)return;
  lastHeight=height;
  if(frame)cancelAnimationFrame(frame);
  frame=requestAnimationFrame(()=>{frame=0;dispatchEvent(new Event('resize'));});
 }).observe(book);
})();
</script>

<script>
// Every faction title page becomes a distinct, centered contents separator.
function markFactionStarts(){
 const list=document.getElementById('contentsList'),data=window.ARKVEIN_BOOK;if(!list||!data)return;

  if(page.type!=='chapter'||!page.chapter||page.chapter==='world')return;
  const row=list.querySelector('[data-page="'+index+'"]');if(!row)return;
  row.classList.add('toc-faction-start');
  row.setAttribute('aria-label','Начало фракции: '+page.title.replace(/\n/g,' '));
  let previous=row.previousElementSibling;
  while(previous&&previous.tagName!=='H3')previous=previous.previousElementSibling;
  if(previous)previous.classList.add('toc-faction-duplicate');
 });
}

<script id="arcwane-tag-avernax-pages">
(()=>{

  const page=window.ARKVEIN_BOOK?.pages[Number(leaf.dataset.index)];
  if(page?.chapter==='avernax')leaf.classList.add('avernax-page');
 });
 tag();
 const book=document.getElementById('book')||document.querySelector('.book');
 if(book)new MutationObserver(tag).observe(book,{childList:true,subtree:true});
})();
</script>


<script id="arcwane-viewer-centered-v47-script">
(()=>{
 const dialog=document.getElementById('artDialog'),image=document.getElementById('artFull');
 if(!dialog||!image)return;
 const frame=image.parentNode;
 let revision=0,first=0,second=0;
 const cancel=()=>{revision++;cancelAnimationFrame(first);cancelAnimationFrame(second);};
 const center=()=>{
  if(!dialog.open||!image.complete||!image.naturalWidth||!frame.clientWidth)return;
  if(dialog.dataset.completeEmblem==='true'){frame.scrollLeft=0;frame.scrollTop=0;return;}
  frame.scrollLeft=Math.max(0,(frame.scrollWidth-frame.clientWidth)/2);
  frame.scrollTop=Math.max(0,(frame.scrollHeight-frame.clientHeight)/2);
 };
 const schedule=()=>{
  cancel();if(!dialog.open)return;
  const token=revision;
  first=requestAnimationFrame(()=>{
   if(token!==revision)return;
   second=requestAnimationFrame(()=>{if(token===revision)center();});
  });
 };
 const opened=()=>{
  schedule();
  const token=revision;
  if(dialog.open&&image.complete&&image.naturalWidth&&image.decode){
   image.decode().then(()=>{if(token===revision)schedule();}).catch(()=>{});
  }
 };
 image.addEventListener('load',schedule);
 new MutationObserver(opened).observe(image,{attributes:true,attributeFilter:['src','srcset']});
 new MutationObserver(opened).observe(dialog,{attributes:true,attributeFilter:['open','data-crop','data-complete-emblem']});
 if(typeof ResizeObserver!=='undefined'){
  const sizes=new ResizeObserver(()=>{if(dialog.open)schedule();});
  sizes.observe(frame);sizes.observe(image);
 }
 window.addEventListener('resize',schedule,{passive:true});
 if(window.visualViewport)window.visualViewport.addEventListener('resize',schedule,{passive:true});
 frame.addEventListener('pointerdown',cancel,{passive:true});
 frame.addEventListener('touchstart',cancel,{passive:true});
 dialog.addEventListener('close',cancel);
 opened();
})();
</script>
<script id="arcwane-reading-gradient-position-v48">
(()=>{
 const book=document.getElementById('book');if(!book)return;
 const observed=new WeakSet();let pending=0;
 const measure=()=>{
  pending=0;
  book.querySelectorAll('.leaf.story[data-index],.leaf.chapter-page[data-index]').forEach(leaf=>{
   const copy=leaf.querySelector('.page-copy');
   const first=copy&&(copy.querySelector('.section')||copy.querySelector('h2')||copy);
   if(!first||!leaf.clientHeight)return;
   // offsetTop avoids distorted bounding boxes while a page is turning in 3D.
   let top=0,node=first;
   while(node&&node!==leaf){top+=node.offsetTop;node=node.offsetParent;}
   if(node!==leaf)return;
   const percentage=Math.max(28,Math.min(84,100*top/leaf.clientHeight));
   leaf.style.setProperty('--reading-top',percentage.toFixed(3)+'%');
   if(resize&&!observed.has(leaf)){observed.add(leaf);resize.observe(leaf);if(copy)resize.observe(copy);}
  });
 };
 const schedule=()=>{if(!pending)pending=requestAnimationFrame(measure);};
 const resize=typeof ResizeObserver!=='undefined'?new ResizeObserver(schedule):null;
 new MutationObserver(schedule).observe(book,{childList:true,subtree:true});
 window.addEventListener('resize',schedule,{passive:true});
 if(document.fonts)document.fonts.ready.then(schedule);
 schedule();
})();
</script>
<script id="arcwane-emblem-portrait-source-v49">
(()=>{
 const dialog=document.getElementById('artDialog'),image=document.getElementById('artFull');if(!dialog||!image)return;
 const portrait=matchMedia('(max-width:700px) and (orientation:portrait)');let page=null;
 const book=document.getElementById('book');
 const titlePages=()=>{
  book?.querySelectorAll('.leaf.chapter-page[data-index]').forEach(leaf=>{
   const index=leaf.dataset.index;if(!['37','75'].includes(index))return;
   const target=leaf.querySelector('.page-art'),data=window.ARKVEIN_BOOK?.pages[Number(index)];if(!target||!data)return;
   const src=portrait.matches?(index==='37'?'limbrein-emblem-portrait.webp?v=49':'avernax-emblem-portrait.webp?v=49'):data.image;
   if(target.getAttribute('src')!==src)target.src=src;
  });
 };
 if(book)new MutationObserver(titlePages).observe(book,{childList:true,subtree:true});
 titlePages();
 const choose=()=>{
  titlePages();
  if(!dialog.open||!['37','75'].includes(page))return;
  const data=window.ARKVEIN_BOOK?.pages[Number(page)];if(!data)return;
  const src=portrait.matches?(page==='37'?'limbrein-emblem-portrait.webp?v=49':'avernax-emblem-portrait.webp?v=49'):data.image;
  if(image.getAttribute('src')!==src)image.src=src;
 };
 document.addEventListener('click',event=>{
  const button=event.target.closest('[data-art]');if(!button)return;
  page=button.dataset.art;queueMicrotask(choose);
 });
 portrait.addEventListener('change',choose);
})();
</script>

 let page=null;
 const fix=()=>{
  if(!portrait.matches||!['5','37','75'].includes(page))return;
  if(dialog.dataset.completeEmblem!=='true')dialog.dataset.completeEmblem='true';if(dialog.dataset.emblem!==page)dialog.dataset.emblem=page;
  const want=P[page];if(want&&!failed.has(want)&&image.getAttribute('src')!==want)image.src=want;
 };
 document.addEventListener('click',e=>{const b=e.target.closest('[data-art]');if(!b)return;page=b.dataset.art;if(!['5','37','75'].includes(page))delete dialog.dataset.emblem;setTimeout(fix,0);},true);
 const failed=new Set();
 image.addEventListener('error',()=>{const src=image.getAttribute('src');if(!Object.values(P).includes(src))return;failed.add(src);const d=window.ARKVEIN_BOOK?.pages[Number(page)];if(d)image.src=d.image;});
 const leaf5=()=>{
  if(!portrait.matches||failed.has(P['5']))return;
  document.querySelectorAll('.leaf.chapter-page[data-index="5"] .page-art').forEach(img=>{
   if(img.dataset.v58)return;img.dataset.v58='1';
   const orig=img.getAttribute('src');
   img.addEventListener('error',()=>{if(img.getAttribute('src')===P['5']){failed.add(P['5']);img.src=orig;img.closest('.leaf').classList.remove('echor-portrait');}});
   img.closest('.leaf').classList.add('echor-portrait');img.src=P['5'];
  });
 };
 const bk=document.getElementById('book');if(bk)new MutationObserver(leaf5).observe(bk,{childList:true,subtree:true});leaf5();
 new MutationObserver(fix).observe(image,{attributes:true,attributeFilter:['src']});
 new MutationObserver(()=>{if(dialog.open)fix();}).observe(dialog,{attributes:true,attributeFilter:['open','data-complete-emblem']});
})();

<style id="arcwane-desktop-light-gradient-v58">
/* Desktop: a lighter fade that starts just before the text, so the art stays visible. */
@media(min-width:701px),(orientation:landscape){
 #book:not(.closed) .leaf[data-index]:not(.cover):not(.contents-page):not(.blank).story::before{
  background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,0) max(0%,calc(var(--reading-top,55%) - 14%)),rgba(0,0,0,.14) max(0%,calc(var(--reading-top,55%) - 8%)),rgba(0,0,0,.36) max(0%,calc(var(--reading-top,55%) - 3%)),rgba(0,0,0,.55) var(--reading-top,55%),rgba(0,0,0,.7) min(100%,calc(var(--reading-top,55%) + 9%)),rgba(0,0,0,.8) min(100%,calc(var(--reading-top,55%) + 22%)),rgba(0,0,0,.85) 100%)!important}
}
</style>
<style id="arcwane-desktop-emblem-light-v62">
/* Desktop emblem pages: a lighter shade under the title. */
@media(min-width:701px),(orientation:landscape){
 #book:not(.closed) .leaf.chapter-page[data-index]:is([data-index="5"],[data-index="37"],[data-index="75"]):not(.cover):not(.contents-page):not(.blank):not(.story)::before{background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 58%,rgba(0,0,0,.18) 70%,rgba(0,0,0,.38) 82%,rgba(0,0,0,.55) 100%)!important}
 #book:not(.closed) .leaf.chapter-page[data-index="5"][data-index]:not(.cover):not(.contents-page):not(.blank):not(.story) .page-art{inset:0 0 auto 0!important;height:110%!important;object-fit:cover!important;object-position:50% 0%!important}
}
</style>
<script id="arcwane-echor-emblem-desktop-v62">
// Echor emblem opens full-screen like Limbrein on every screen.
document.addEventListener('click',e=>{const b=e.target.closest('[data-art]');if(!b||b.dataset.art!=='5')return;const d=document.getElementById('artDialog');if(d.dataset.completeEmblem!=='true')d.dataset.completeEmblem='true';});
</script>
